run_name: llama31-8b-toolace-lora
method: lora
base_model: models/toolace-8b
data_dir: data/processed
output_dir: checkpoints/lora
seed: 42
max_seq_length: 8192
num_train_epochs: 2
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 2
bf16: true
gradient_checkpointing: true
packing: false
assistant_only_loss: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
